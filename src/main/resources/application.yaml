spring:
  application:
    name: FlightAviationApp
    
  profiles:
    # Эта строка заставляет Spring подключать файл application-local.yaml, если он существует.
    include: local 

  datasource:
    url: jdbc:postgresql://localhost:5433/Aviation
    username: postgres
    password: rootroot

  jpa:
    hibernate:
      ddl-auto: update # Hibernate сам создаст таблицы по твоим @Entity
    show-sql: true     # Видеть SQL-запросы в консоли (полезно при обучении)
    properties:
      hibernate:
        format_sql: true # Делает SQL-запросы в логах читаемыми

server:
  port: 8080 # Порт, на котором слушает Spring Boot